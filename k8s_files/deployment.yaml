---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project-app
  labels:
    app: devops-project-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-project-app
  template:
    metadata:
      labels:
        app: devops-project-app
    spec:
      containers:
      - name: devops-project-container
        image: 598537770925.dkr.ecr.us-east-1.amazonaws.com/amazon-prime:latest
        ports:
        - containerPort: 3000
...
